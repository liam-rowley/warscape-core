# wsc.toml: what this repo declares to the warscape-core CLI (`python3 wsc.py ...`). Any key not set here takes its default
# from `warscape/repo.py` DEFAULTS. A game repo writes the same file at its own root (docs/CONSUMING.md).
registries_dir = "registries"

[registries]
# name = "core:<schema>" (a schema the core ships in schemas/) or a repo-relative path to the repo's own schema.
# The core's real registry is `tools`. The other seven are declared, and stay empty here, so CI exercises every shipped schema
# end to end (load, check, render); each game repo fills its own.
tools = "core:tools"
scenarios = "core:scenarios"
assets = "core:assets"
jobs = "core:jobs"                      # the core's own job queue (napoleon J62)
ui_elements = "core:ui_elements"
engine_sites = "core:engine_sites"
config_keys = "core:config_keys"
hotkeys = "core:hotkeys"
engine_facts = "core:engine_facts"

[tools]
include = [".githooks/*"]                                   # extensionless git hooks are tools too
library = ["warscape/*.py", "warscape/verbs/__init__.py"]   # importable library modules: docstrings, no registry row
exempt = ["tests/**", "discovery/tests/**"]                                       # host tests run through the `tests` gate
retire_after_days = 0     # off until the job queue stamps last_used (C9)

[docs]
max_kb = 30          # living-doc cap in KiB; dated records (a YYYY-MM-DD in the file name, or under records/ reports/ runs/) are exempt

[tests]
dirs = ["tests", "discovery/tests"]

# The core runs its own job queue (napoleon J62): rows in registries/jobs/<id>.json, folders in jobs/<id>/, ids W<n>, the same pipeline a game uses.
[storage]
dir = ["jobs"]

# Views are not committed (C19): a brief/ branch may change only its brief and its row, and a committed registries/jobs.md would have to change with the row.
# `python3 wsc.py reg render` writes them to the git-ignored _scratch/registries/.
[views]
commit = false

[jobs]
id_prefix = "W"
semver_from = 39     # W29 (C27): from W39 on a row carries `semver`, its brief a `Semver:` line, and its job/ branch leaves VERSION to the release workflow

[jobs.text]
wsc = "python3 wsc.py"
plan_doc = "docs/BACKLOG.md"
review_doc = "docs/REVIEW.md"
owner = "Liam"
rules_ref = "CLAUDE.md, Jobs"
trailer_hint = 'by hand: git commit --trailer "Claude-Session: <session id>"'
plan_summary = "docs, briefs, the jobs registry, README.md and CLAUDE.md"
ref_merge = "C18"
ref_brief_merge = "C18"

[policy]
commit_msg_hook = true     # .githooks/commit-msg refuses a commit without a Claude-Session trailer (C23)
decisions = "docs/DECISIONS.md"
decision_prefix = "C"
plan = ["docs/*", "docs/**", "jobs/*/brief.md", "registries/jobs/*", "README.md", "CLAUDE.md"]
meta = ["docs/*", "docs/**", "jobs/*/brief.md", "registries/jobs/*", "README.md", "CLAUDE.md", ".github/**", "ci/**", "tests/*",
        "tests/**", "wsc.toml", ".gitattributes", ".gitignore", "schemas/*", "registries/*"]

# Release tags by workflow (W29, C27; docs/CONSUMING.md, Releases): ci/release.yml.in, `wsc release`. annotated_from: the first version the
# workflow tags (older tags stay lightweight, never rewritten). Each consumer's adapter compiles against the candidate before the tag.
[release]
annotated_from = "0.31.0"
consumers = [{name = "napoleon", repo = "liam-rowley/napoleon-remastered", adapter = "proxy/napoleon", ref = "main"}]

[ci]
workflows = ["gates.yml", "policy.yml", "release.yml"]
core = ""
# the checks main's ruleset must require (`wsc ci check-settings`); gates is a matrix job, so its checks are listed by name (W21)
required_checks = ["gates (ubuntu-latest)", "gates (windows-latest)", "policy", "proxy", "harness-windows"]

# proxy: the proxy sources, tools, host tests and the null game it builds; harness: the watcher kit, the proxy tools and null game its
# installer case kits, the moved-tools test and the library its Python helpers import. A workflow or template change runs both (W21).
[ci.inputs]
proxy = '^\.github/workflows/|^ci/|^proxy/|^wsc\.toml$'
harness = '^\.github/workflows/|^ci/|^harness/|^proxy/tools/|^proxy/tests/null_game/|^tests/test_moved_tools\.py$|^warscape/|^wsc\.toml$'
