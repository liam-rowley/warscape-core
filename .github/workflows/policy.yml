# Generated by `wsc ci render` from ci/policy.yml.in: do not edit this file; edit the template or [ci] in wsc.toml.
# purpose: CI's `policy` check on every pull request: the branch kind decides what it may change (`wsc policy`, docs/CONSUMING.md "The job pipeline"),
#          judged with the base's rules; a failure comments on the pull request.
# usage: runs on GitHub Actions; locally (after git fetch): python3 wsc.py policy --branch <branch> --base origin/main [--head <rev>]
# when: automatic on pull requests; require the "policy" check in branch protection for main.
# pull_request_target (W23, C24): GitHub runs this file as it is on main, never a pull request's copy, so a branch cannot edit its own check, and
# `wsc policy` judges the head's commits with main's code and configuration. The job has the base's privileges: no step checks out, builds,
# caches or runs the pull request's files (the policy block fetches the head as git objects; `wsc ci render` refuses a template without it).
# Draft pull requests skip it: a job's builder opens its pull request as a draft when the job reaches review, so the review sees the branch's CI
# without a `policy` that must fail until the review says merge. The reviewer marks the pull request ready BEFORE pushing the review commit
# (a skipped policy counts as passed, and `gh pr merge --auto` merges at once when the checks have passed), so the pushed head gets a real
# `policy` run; the ready_for_review run on the old head has no merge verdict and is red by design: the push cancels it, and `notify` stays silent.
name: policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  policy:
    # Every pull request must be a reviewed job, a brief, a planning change or an infrastructure change (`wsc policy`), judged with
    # the base's rules (W23). This job runs with the base's privileges: no step checks out, builds, caches or runs the pull request's
    # files; its head is fetched as git objects for `wsc policy` to read, and the head's names reach scripts through env only.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pull/$PR/head"
      - env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python wsc.py policy --branch "$HEAD_REF" --base "origin/$BASE_REF" --head "$HEAD_SHA"
  notify:
    needs: [policy]
    if: failure() && github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: python3 wsc.py ci notify --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --branch "$BRANCH" --repo "$GITHUB_REPOSITORY"
