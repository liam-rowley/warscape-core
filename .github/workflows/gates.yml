# Generated by `wsc ci render` from ci/gates.yml.in: do not edit this file; edit the template or [ci] in wsc.toml.
# purpose: CI gates on every push: the full `wsc gates` set (schemas, registries, tool rows, strict JSON, Windows paths, doc size, undated
#          "verified", conflict markers, line endings, host tests) on Linux and Windows, the proxy DLL build and tests, the harness host tests.
# usage: runs on GitHub Actions; locally: python3 wsc.py gates
# when: automatic; main's ruleset should require the checks in wsc.toml [ci] required_checks (`python3 wsc.py ci check-settings` says what is missing).
# No installs: the core is Python 3.12 standard library only.
# Generated blocks (`changes`, `notify`, each slow job's `if:` and pass-marker steps, the fetch cache) come from warscape/ci_render.py and
# wsc.toml [ci]: edit this template, then run `python3 wsc.py ci render` and commit both files (the `ci_render` gate compares them).
# One run per commit (napoleon J42, W21): push only, never pull_request. Checks attach to the commit, so a pull request shows this push run's
# checks on its head; `policy` needs the pull request and lives in policy.yml. A newer push cancels an older run on the same branch, never on main.
# Pass markers (napoleon J54, J57): `proxy` and `harness-windows` run only when their inputs (wsc.toml [ci] inputs) changed and that input tree
# has not passed already; a skipped job counts as passed for required checks and auto-merge, so a docs-only branch does not wait for them.
# Main health (W22): a push to main has no diff base, so a set runs unless a pass marker proves its tree passed (a red set is rerun by the next
# push), and the `main_health` job (from the notify block) opens, updates or closes one issue per red required job (`wsc ci main-health`).
# Fail safe: each slow job's `if:` starts with `!cancelled()` and runs whenever `changes` did not succeed; a cache error, an empty hash or an
# unreadable marker runs the job.
name: gates
on:
  push:
permissions:
  contents: read
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # changes: which slow jobs this run needs. A push to a branch diffs against its merge base with main. A push to main has no base
  # (W22): every set counts as changed and only a pass marker for its tree skips it, so a set that failed on main runs again.
  # When the base is unknown (a branch with no merge base, a shallow clone) everything runs.
  # Which files feed which job: `wsc.toml` [ci] inputs, read by `python3 wsc.py ci inputs`. Then a changed set whose tree hash has a pass marker
  # is turned off; its outputs are the combined answer: true = inputs changed against the base AND no marker for this tree.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proxy: ${{ steps.run.outputs.proxy }}
      harness: ${{ steps.run.outputs.harness }}
      proxy_tree: ${{ steps.diff.outputs.proxy_tree }}
      harness_tree: ${{ steps.diff.outputs.harness_tree }}
      tree_salt: ${{ steps.diff.outputs.tree_salt }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then base=''
          else base=$(git merge-base origin/main HEAD || true); fi
          python3 wsc.py ci inputs --base "$base" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      # pass markers: looked up only for a set that changed, on a push, with a hash; the marker is a one-line file, restored whole
      - id: proxy_pass
        if: github.event_name == 'push' && steps.diff.outputs.proxy == 'true' && steps.diff.outputs.proxy_tree != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .ci-pass/proxy
          key: ci-pass-${{ steps.diff.outputs.tree_salt }}-proxy-${{ steps.diff.outputs.proxy_tree }}
          enableCrossOsArchive: true
      - id: harness_pass
        if: github.event_name == 'push' && steps.diff.outputs.harness == 'true' && steps.diff.outputs.harness_tree != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .ci-pass/harness
          key: ci-pass-${{ steps.diff.outputs.tree_salt }}-harness-${{ steps.diff.outputs.harness_tree }}
          enableCrossOsArchive: true
      # a set runs when its inputs changed and no readable marker exists for its tree hash; a skip names the run that passed it
      - id: run
        env:
          PROXY: ${{ steps.diff.outputs.proxy }}
          HARNESS: ${{ steps.diff.outputs.harness }}
          PROXY_HIT: ${{ steps.proxy_pass.outputs.cache-hit }}
          HARNESS_HIT: ${{ steps.harness_pass.outputs.cache-hit }}
        run: |
          decide() {   # set, changed, cache-hit, artifact
            m=.ci-pass/$1/marker.txt
            if [ "$2" = true ] && [ "$3" = true ] && grep -q '^run=[0-9]' "$m" 2>/dev/null; then
              echo "$1=false" >> "$GITHUB_OUTPUT"
              run=$(sed -n 's/^run=//p' "$m"); attempt=$(sed -n 's/^attempt=//p' "$m"); commit=$(sed -n 's/^commit=//p' "$m")
              tree=$(sed -n 's/^tree=//p' "$m")
              line="\`$1\` skipped: its input tree $tree already passed in run $run (attempt $attempt, commit $commit)"
              [ -n "$4" ] && line="$line; its build: \`gh run download $run -n $4\`"
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"; echo "$line"
            else
              echo "$1=$2" >> "$GITHUB_OUTPUT"
            fi
          }
          decide proxy "$PROXY" "$PROXY_HIT" ''
          decide harness "$HARNESS" "$HARNESS_HIT" ''
          cat "$GITHUB_OUTPUT"
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: wsc gates (full set)
        run: python wsc.py gates

  # proxy (napoleon J12): the proxy core moved here. Build the DLL with the null game (proxy/tests/null_game), run every C++ host test,
  # prove the DLL does not depend on the checkout path, and smoke it under wine. WSP_BUILD_ID: build_id.py hashes a game repo's inputs,
  # and the null game is a folder inside this repo (backlog B16).
  # The toolchain (W24, C25): the mingw-w64 packages at the exact versions of proxy/tools/toolchain.py, a build-id input that build.sh checks
  # before it compiles (refused off the pin). The runner image stays outside the pass-marker key: with the toolchain pinned and checked it
  # cannot change the DLL's bytes; it can change the host tests' g++ and the smoke's wine, which the next proxy/ change exercises, and
  # [ci] salt stays the manual lever. build.sh writes the job's step summary (the DLL's id, sha256, bytes, toolchain, repro and smoke lines).
  proxy:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && (needs.changes.result != 'success' || needs.changes.outputs.proxy == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # J30: RmlUi and FreeType compile twice (mingw for the DLL, g++ for the host tests)
    env:
      WSP_GAME_ROOT: proxy/tests/null_game   # relative to the checkout: layout.py resolves it
      WSP_BUILD_ID: nullgame-ci
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: the pinned mingw-w64 toolchain (proxy/tools/toolchain.py apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends $(python3 proxy/tools/toolchain.py apt)
          dpkg-query -W -f '${Package}=${Version}\n' '*mingw-w64*'
      # fetch cache (W21): the raw downloads (tarballs, RmlUi and FreeType checkouts), keyed by the pins and [ci] salt, never the patched
      # trees; a warm cache makes the fetch offline. A cache fault never fails the job; the fetchers' sha checks judge every byte, and
      # the fetchers retry their own downloads and git fetches on a network flake inside build.sh (W24), never a wrong byte.
      - id: fetch_key
        run: python3 proxy/tools/netfetch.py ci-cache >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ steps.fetch_key.outputs.paths }}
          key: fetch-1-${{ steps.fetch_key.outputs.key }}
      - id: dll
        run: proxy/tools/build.sh all
      # proxy map (W35, C28): the linker map, its sidecar and the build line of this job's DLL as proxy-map-<build id>, the name build.sh
      # printed into the build step's outputs; 90 days is GitHub's maximum, a release attaches its own (docs/PROXY_BUILD.md).
      - id: proxy_map
        if: success() && steps.dll.outputs.map_name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.dll.outputs.map_name }}
          path: ${{ steps.dll.outputs.map_files }}
          retention-days: 90
          if-no-files-found: error
      - name: the proxy map in the step summary
        if: success() && steps.dll.outputs.map_name != ''
        env:
          NAME: ${{ steps.dll.outputs.map_name }}
          URL: ${{ steps.proxy_map.outputs.artifact-url }}
        run: echo "- linker map artifact: [$NAME]($URL), kept 90 days (wsc crash symbolise DUMP --build-id ID)" >>"$GITHUB_STEP_SUMMARY"
      - name: the DLL and its linker map are byte-identical from another checkout path, and the DLL without the map flag
        run: proxy/tools/build.sh repro
      - name: smoke test the DLL under wine (a stand-in exe loads it; guard verdicts, config, log, clean detach, a DLL fault symbolised)
        run: |
          sudo dpkg --add-architecture i386 && sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends wine wine32:i386
          proxy/tools/build.sh smoke
      # W35: the smoke's DLL fault (its minidump and proxy.log), so `wsc crash symbolise` can be run on a real dump anywhere
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: proxy-smoke-dll-fault
          path: proxy/tests/null_game/build/proxy/smoke_dll_fault.*
          retention-days: 30
          if-no-files-found: ignore
      - name: smoke test a game without gestures (W37, the null game with no GestureAdapter, so steps 6 and 7 take the inert path)
        env:
          WSP_GAME_ROOT: proxy/tests/null_game_no_gesture
        run: |
          proxy/tools/build.sh dll
          proxy/tools/build.sh smoke
      # pass marker: the last step, on success of a push run only; `changes` skips this job on the same input tree
      - name: pass marker
        if: success() && github.event_name == 'push' && needs.changes.outputs.proxy_tree != ''
        env:
          TREE: ${{ needs.changes.outputs.proxy_tree }}
        run: |
          mkdir -p .ci-pass/proxy
          { echo "set=proxy"; echo "tree=$TREE"; echo "run=$GITHUB_RUN_ID"; echo "attempt=$GITHUB_RUN_ATTEMPT"; echo "commit=$GITHUB_SHA"; } > .ci-pass/proxy/marker.txt
          cat .ci-pass/proxy/marker.txt
      - if: success() && github.event_name == 'push' && needs.changes.outputs.proxy_tree != ''
        uses: actions/cache/save@v5
        with:
          path: .ci-pass/proxy
          key: ci-pass-${{ needs.changes.outputs.tree_salt }}-proxy-${{ needs.changes.outputs.proxy_tree }}
          enableCrossOsArchive: true

  # harness-windows (napoleon J12): the watcher kit moved here. Its unit and integration host tests under Windows PowerShell 5.1 with
  # compiled fake games; the installer case builds a real harness kit from the null game's adapter.
  harness-windows:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && (needs.changes.result != 'success' || needs.changes.outputs.harness == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      WSP_GAME_ROOT: proxy/tests/null_game   # relative to the checkout: layout.py resolves it
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: python3 for job.sh (setup-python gives python only)
        shell: powershell
        run: |
          $py = (Get-Command python).Source
          $py3 = Join-Path (Split-Path $py) 'python3.exe'
          if (-not (Test-Path $py3)) { Copy-Item $py $py3 }
      # W8: the job.sh and Git Bash finder tests too; WSC_REQUIRE_BASH turns their "no Git Bash or python3" skip into a failure here
      - name: moved tools host tests that run bash (Git Bash found explicitly)
        timeout-minutes: 8
        shell: powershell
        env:
          WSC_REQUIRE_BASH: '1'
        run: |
          python -m unittest tests.test_moved_tools tests.test_job_sh tests.test_gitbash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: harness host tests (unit and integration)
        timeout-minutes: 18
        shell: powershell
        run: ./harness/tests/Run-HostTests.ps1 -Suite all
      # pass marker: the last step, on success of a push run only; `changes` skips this job on the same input tree
      - name: pass marker
        if: success() && github.event_name == 'push' && needs.changes.outputs.harness_tree != ''
        shell: bash
        env:
          TREE: ${{ needs.changes.outputs.harness_tree }}
        run: |
          mkdir -p .ci-pass/harness
          { echo "set=harness"; echo "tree=$TREE"; echo "run=$GITHUB_RUN_ID"; echo "attempt=$GITHUB_RUN_ATTEMPT"; echo "commit=$GITHUB_SHA"; } > .ci-pass/harness/marker.txt
          cat .ci-pass/harness/marker.txt
      - if: success() && github.event_name == 'push' && needs.changes.outputs.harness_tree != ''
        uses: actions/cache/save@v5
        with:
          path: .ci-pass/harness
          key: ci-pass-${{ needs.changes.outputs.tree_salt }}-harness-${{ needs.changes.outputs.harness_tree }}
          enableCrossOsArchive: true

  # notify: the last job; a failure in any job above, on a branch with an open pull request, comments once there (a failed check leaves the
  # pull request open: this makes it impossible to miss). The only job with write access, and only to pull requests.
  notify:
    needs: [changes, gates, proxy, harness-windows]
    if: failure() && github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 wsc.py ci notify --run-id ${{ github.run_id }} --attempt ${{ github.run_attempt }} --branch "${{ github.ref_name }}" --repo "${{ github.repository }}"
  main_health:
    needs: [changes, gates, proxy, harness-windows]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 wsc.py ci main-health --run-id ${{ github.run_id }} --attempt ${{ github.run_attempt }} --repo "${{ github.repository }}"
